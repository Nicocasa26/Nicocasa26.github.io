<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capacitación | CONEMAT</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:#f4f6f8;
padding:40px;
margin:0;
}

.card{
max-width:720px;
margin:auto;
background:#ffffff;
padding:30px;
border-radius:8px;
text-align:center;
}

input[type="text"]{
width:100%;
padding:10px;
margin-bottom:12px;
font-size:16px; /* evita el zoom automático en iPhone */
}

input[type="checkbox"]{
width:auto;
margin:0 8px 0 0;
vertical-align:middle;
transform:scale(1.2);
}

button{
width:100%;
padding:12px;
background:#0d6efd;
color:white;
border:none;
border-radius:4px;
cursor:pointer;
font-size:15px;
margin-top:10px;
}

button:disabled{
background:#9ca3af;
cursor:not-allowed;
}

iframe{
width:100%;
aspect-ratio:16/9;
height:auto;
border:none;
margin-top:20px;
}

.error{
color:#b91c1c;
margin-top:15px;
font-weight:bold;
}

.success{
background:#d4edda;
padding:12px;
border-radius:6px;
color:#155724;
margin-top:15px;
}

.legal{
font-size:0.85em;
margin-top:10px;
color:#555;
text-align:left;
}

hr{
margin:25px 0;
}

canvas{
border:2px solid #d1d5db;
border-radius:6px;
background:white;
width:100%;
max-width:420px;
height:160px;
margin:10px auto;
display:block;
touch-action:none; /* evita que la pantalla se mueva mientras firmás */
}

/* ====== AJUSTES PARA CELULAR ====== */
@media (max-width:600px){

body{
padding:12px;
}

.card{
padding:18px;
}

h2{
font-size:1.3em;
}

button{
padding:14px;
font-size:16px;
}

canvas{
max-width:100%;
}

}

</style>
</head>

<body>

<div class="card" id="contenido">
<p>Cargando capacitación...</p>
</div>

<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL="https://brdekhbqophvcobhxdgc.supabase.co"
const SUPABASE_KEY="sb_publishable_CTkAN6flGJDQGVYV2VDUTg_Ov8CuhXn"

const {createClient}=supabase
const client=createClient(SUPABASE_URL,SUPABASE_KEY)

/* ================= PARAMS ================= */

const params=new URLSearchParams(window.location.search)
const token=params.get("token")
const contenedor=document.getElementById("contenido")

/* ================= STATE ================= */

let capacitacionEmpresaId=null
let empresaNombre=""
let videoURL=""
let tituloCapacitacion=""
let signaturePad=null

/* ================= HELPERS ================= */

/* Escapa texto para insertarlo de forma segura en HTML */
function esc(texto){
return String(texto ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#39;")
}

/* Soporta youtu.be/ID, watch?v=ID, embed/ID y shorts/ID, con o sin parámetros extra */
function youtubeEmbed(url){

const match=String(url||"").match(
/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/
)

const id=match ? match[1] : ""

return `https://www.youtube.com/embed/${id}`

}

/* Devuelve true si la fecha de vencimiento ya pasó (vence al final de ese día) */
function estaVencida(fecha){

if(!fecha) return false

const soloFecha=String(fecha).substring(0,10)
const limite=new Date(soloFecha+"T23:59:59")

if(isNaN(limite.getTime())) return false

return new Date() > limite

}

/* ================= CARGA ================= */

async function cargarCapacitacion(){

if(!token){
contenedor.innerHTML="<p class='error'>Link inválido.</p>"
return
}

try{

const {data,error}=await client
.from("capacitaciones_empresas")
.select(`
id,
finalizada,
fecha_vencimiento,
empresas ( nombre ),
capacitaciones_base ( nombre, url_video )
`)
.eq("link_publico",token)
.single()

if(error||!data){
contenedor.innerHTML="<p class='error'>Capacitación no encontrada.</p>"
return
}

if(data.finalizada){
contenedor.innerHTML=`
<h2>Capacitación finalizada</h2>
<p>Esta capacitación ya fue cerrada.</p>
`
return
}

if(estaVencida(data.fecha_vencimiento)){
contenedor.innerHTML=`
<h2>Link vencido</h2>
<p>El plazo para realizar esta capacitación ya terminó. Comuníquese con CONEMAT.</p>
`
return
}

capacitacionEmpresaId=data.id
empresaNombre=data.empresas?.nombre || ""
videoURL=data.capacitaciones_base?.url_video || ""
tituloCapacitacion=data.capacitaciones_base?.nombre || "Capacitación"

mostrarFormulario(data.fecha_vencimiento)

}catch(err){
console.error("Error cargando capacitación:",err)
contenedor.innerHTML="<p class='error'>No se pudo cargar la capacitación. Intente nuevamente.</p>"
}

}

/* ================= FORMULARIO ================= */

function mostrarFormulario(vencimiento){

contenedor.innerHTML=`

<h2>${esc(tituloCapacitacion)} – CONEMAT</h2>
<p><strong>Empresa:</strong> ${esc(empresaNombre)}</p>
<p><strong>Vigente hasta:</strong> ${esc(vencimiento)}</p>

<hr>

<h3>Registro obligatorio</h3>

<input type="text" id="nombre" placeholder="Apellido y Nombre" autocomplete="name">
<input type="text" id="dni" placeholder="DNI (7 u 8 dígitos)" inputmode="numeric">
<input type="text" id="puesto" placeholder="Puesto / Tarea">

<div class="legal">
<label>
<input type="checkbox" id="declaracion">
Declaro que los datos ingresados son verídicos y que participé de la capacitación.
</label>
</div>

<h4>Firma</h4>

<canvas id="firmaCanvas"></canvas>

<button type="button" onclick="limpiarFirma()">
Limpiar firma
</button>

<button id="btnRegistrar" onclick="registrar()">Registrar y acceder</button>

<div id="mensaje"></div>

`

inicializarFirma()

}

/* ================= FIRMA ================= */

function inicializarFirma(){

const canvas=document.getElementById("firmaCanvas")
let anchoAnterior=0

function resizeCanvas(){

/* Solo redimensiona si cambió el ANCHO (el teclado del celu cambia el alto y borraba la firma) */
if(canvas.offsetWidth===anchoAnterior) return
anchoAnterior=canvas.offsetWidth

const datosPrevios=signaturePad ? signaturePad.toData() : null

const ratio=Math.max(window.devicePixelRatio||1,1)

canvas.width=canvas.offsetWidth*ratio
canvas.height=canvas.offsetHeight*ratio

canvas.getContext("2d").scale(ratio,ratio)

if(signaturePad){
signaturePad.clear()
if(datosPrevios && datosPrevios.length) signaturePad.fromData(datosPrevios)
}

}

resizeCanvas()

signaturePad=new SignaturePad(canvas,{
minWidth:1,
maxWidth:2.5,
penColor:"black"
})

window.addEventListener("resize",resizeCanvas)

}

function limpiarFirma(){
if(signaturePad) signaturePad.clear()
}

function obtenerFirma(){

if(!signaturePad || signaturePad.isEmpty()){

alert("Debe firmar antes de registrarse")
return null

}

return signaturePad.toDataURL()

}

/* ================= REGISTRAR ================= */

async function registrar(){

const nombre=document.getElementById("nombre").value.trim()
const dni=document.getElementById("dni").value.trim().replace(/\D/g,"")
const puesto=document.getElementById("puesto").value.trim()
const declaracion=document.getElementById("declaracion").checked
const mensaje=document.getElementById("mensaje")
const btn=document.getElementById("btnRegistrar")

mensaje.innerHTML=""

if(!nombre||!dni||!puesto||!declaracion){

mensaje.innerHTML="<div class='error'>Complete todos los campos.</div>"
return

}

if(dni.length<7||dni.length>8){

mensaje.innerHTML="<div class='error'>DNI inválido.</div>"
return

}

const firma=obtenerFirma()

if(!firma){
return
}

/* Evita doble clic mientras se guarda */
btn.disabled=true
btn.textContent="Registrando..."

function rehabilitar(){
btn.disabled=false
btn.textContent="Registrar y acceder"
}

try{

const {data:existente}=await client
.from("asistentes")
.select("nombre")
.eq("dni",dni)
.eq("capacitacion_id",capacitacionEmpresaId)
.maybeSingle()

if(existente){

mensaje.innerHTML=`
<div class="error">
${esc(existente.nombre)} ya se encuentra registrado en esta capacitación.
</div>
`
rehabilitar()
return

}

const {error}=await client.from("asistentes").insert([{

nombre,
dni,
puesto,
empresa:empresaNombre,
capacitacion_id:capacitacionEmpresaId,
declaracion_aceptada:true,
firma:firma

}])

if(error){

console.error("Error al registrar:",error)

/* 23505 = violación de UNIQUE (ya registrado) */
if(error.code==="23505"){
mensaje.innerHTML="<div class='error'>Este DNI ya se encuentra registrado en esta capacitación.</div>"
}else{
mensaje.innerHTML="<div class='error'>Error al registrar.</div>"
}

rehabilitar()
return

}

mostrarVideo()

}catch(err){

console.error("Excepción al registrar:",err)
mensaje.innerHTML="<div class='error'>Error de conexión. Intente nuevamente.</div>"
rehabilitar()

}

}

/* ================= VIDEO ================= */

function mostrarVideo(){

contenedor.innerHTML=`

<h2>${esc(tituloCapacitacion)} – CONEMAT</h2>
<p><strong>Empresa:</strong> ${esc(empresaNombre)}</p>

<iframe src="${esc(youtubeEmbed(videoURL))}" allowfullscreen></iframe>

<div class="success">
Registro confirmado. Puede visualizar la capacitación.
</div>

`

}

/* ================= INIT ================= */

cargarCapacitacion()

</script>

</body>
</html>
